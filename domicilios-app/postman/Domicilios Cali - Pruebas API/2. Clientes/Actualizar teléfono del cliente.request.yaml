$kind: http-request
description: ""
url: "{{baseUrl}}/api/clientes/{{idClientePrueba}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numeroIdentificacion": "{{idClientePrueba}}",
      "nombre": "Pedro",
      "apellido_Paterno": "Gómez",
      "apellido_Materno": "Rivas",
      "numeroTelefono": "3009998877",
      "correoElectronico": "pedro.gomez@gmail.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', function () { pm.response.to.have.status(200); });
      pm.test('Teléfono actualizado', function () { pm.expect(pm.response.json().numeroTelefono).to.eql('3009998877'); });
    language: text/javascript
order: 4000
