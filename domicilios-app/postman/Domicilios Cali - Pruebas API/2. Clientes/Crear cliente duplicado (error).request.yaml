$kind: http-request
description: La PK de Cliente no permite repetir el número de identificación.
url: "{{baseUrl}}/api/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numeroIdentificacion": "{{idClientePrueba}}",
      "nombre": "Pedro",
      "apellido_Paterno": "Gómez",
      "apellido_Materno": "Rivas",
      "numeroTelefono": "3001112233",
      "correoElectronico": "pedro.gomez@gmail.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 409', function () { pm.response.to.have.status(409); });
      pm.test('Trae mensaje de error', function () { pm.expect(pm.response.json().error).to.be.a('string'); });
    language: text/javascript
order: 2000
