$kind: http-request
name: "Error: dirección de otro cliente"
description: La dirección 1 es de Laura Correa, no del cliente de prueba.
url: "{{baseUrl}}/api/solicitudes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idCliente": "{{idClientePrueba}}",
      "idDireccion": 1,
      "idEstablecimiento": "{{idEstablecimiento}}",
      "descripcion": "Pedido #5001 - 2 hamburguesas",
      "montoTotal": 45000,
      "idMetodoPago": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', function () { pm.response.to.have.status(400); });
      pm.test('Trae mensaje de error', function () { pm.expect(pm.response.json().error).to.be.a('string'); });
    language: text/javascript
order: 5000
