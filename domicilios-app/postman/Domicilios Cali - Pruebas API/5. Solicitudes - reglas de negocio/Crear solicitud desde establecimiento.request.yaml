$kind: http-request
description: ""
url: "{{baseUrl}}/api/solicitudes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idCliente": "{{idClientePrueba}}",
      "idDireccion": "{{idDireccion}}",
      "idEstablecimiento": "{{idEstablecimiento}}",
      "descripcion": "Pedido #5001 - 2 hamburguesas",
      "montoTotal": 45000,
      "idMetodoPago": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('numeroSolicitud', pm.response.json().numeroSolicitud);
      pm.test('Queda en estado Creada', function () { pm.expect(pm.response.json().nombreEstadoSolicitud).to.eql('Creada'); });
    language: text/javascript
order: 1000
