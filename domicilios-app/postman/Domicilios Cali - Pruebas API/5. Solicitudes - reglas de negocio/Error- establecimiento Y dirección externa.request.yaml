$kind: http-request
name: "Error: establecimiento Y dirección externa"
description: "Regla: un único lugar de recogida."
url: "{{baseUrl}}/api/solicitudes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idCliente": "{{idClientePrueba}}",
      "idDireccion": "{{idDireccion}}",
      "idEstablecimiento": "{{idEstablecimiento}}",
      "descripcion": "Pedido #5001 - 2 hamburguesas",
      "montoTotal": 45000,
      "idMetodoPago": 2,
      "direccionRecogidaExterna": "Calle 1 # 2-3"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', function () { pm.response.to.have.status(400); });
      pm.test('Trae mensaje de error', function () { pm.expect(pm.response.json().error).to.be.a('string'); });
    language: text/javascript
order: 3000
