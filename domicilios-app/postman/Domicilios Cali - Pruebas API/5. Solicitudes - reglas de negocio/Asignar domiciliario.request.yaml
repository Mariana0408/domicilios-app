$kind: http-request
description: ""
url: "{{baseUrl}}/api/solicitudes/{{numeroSolicitud}}/asignar"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idDomiciliario": "{{idDomiciliarioPrueba}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', function () { pm.response.to.have.status(200); });
      pm.test('Estado Asignada y fecha de asignación', function () { const j = pm.response.json(); pm.expect(j.nombreEstadoSolicitud).to.eql('Asignada'); pm.expect(j.fechaAsignacion).to.not.be.null; });
    language: text/javascript
order: 9000
