$kind: http-request
description: ""
url: "{{baseUrl}}/api/incidentes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numeroSolicitud": "{{numeroSolicitud}}",
      "idTipoIncidente": 1,
      "descripcion": "Trancón en la Calle 5"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('codigoIncidente', pm.response.json().codigoIncidente);
    language: text/javascript
order: 1000
