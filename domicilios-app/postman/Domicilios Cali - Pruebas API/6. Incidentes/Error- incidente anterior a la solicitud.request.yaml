$kind: http-request
name: "Error: incidente anterior a la solicitud"
description: ""
url: "{{baseUrl}}/api/incidentes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numeroSolicitud": "{{numeroSolicitud}}",
      "idTipoIncidente": 1,
      "descripcion": "Fecha imposible",
      "fechaIncidente": "2020-01-01",
      "horaIncidente": "08:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', function () { pm.response.to.have.status(400); });
      pm.test('Trae mensaje de error', function () { pm.expect(pm.response.json().error).to.be.a('string'); });
    language: text/javascript
order: 2000
