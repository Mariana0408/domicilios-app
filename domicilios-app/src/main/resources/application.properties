# ---------- Conexión a MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/ProyectoIntegrador?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=.

# ---------- Servidor ----------
# La interfaz queda en http://localhost:8080
server.port=8080

# ---------- Ver en consola cada SQL que ejecuta la interfaz ----------
# Útil en la sustentación: cada clic en la interfaz muestra aquí el INSERT/UPDATE/DELETE que se envió a MySQL.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
